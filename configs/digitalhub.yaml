# What a run submitted to DigitalHub is given, and what it publishes.

# The project every run and every published archive belongs to.
project: mars-multisensor-features

# The repository the platform clones, and where that clone lands on the job.
repository: https://github.com/andreablushi/mars-multisensor-dataset
source_root: /shared

# The image a job is built on, its extras what the platform itself asks for
python_version: PYTHON3_13
image_extras:
  - digitalhub>=0.15.11,<0.16
  - pandas

# What each stage is scheduled on, its profile settling the limit it is killed at.
# A stage marked shared queues on the shared pool, the rest on the reserved one.
# A stage marked isis has ISIS installed in its image, which only the CTX builds need.
resources:
  image:
    profile: cpu
    shared: true
  pipeline:
    profile: cpu
    shared: true
    cpu: 8
    memory: 32Gi
    disk: 64Gi
  selection:
    profile: cpu
    shared: true
    cpu: 8
    memory: 32Gi
    disk: 64Gi
  # A build's disk holds 100 GiB of crops before they go up, beside the products still being cut
  build_training:
    profile: cpu
    shared: true
    isis: true
    cpu: 10
    memory: 40Gi
    disk: 150Gi
  build_evaluation:
    profile: cpu
    shared: false
    isis: true
    cpu: 10
    memory: 40Gi
    disk: 120Gi

