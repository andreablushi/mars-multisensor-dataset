# What a run submitted to DigitalHub is given, and what it publishes.

# The project every run and every published archive belongs to.
project: mars-multisensor-features

# The repository the platform clones, and where that clone lands on the job.
repository: https://github.com/andreablushi/mars-multisensor-dataset
source_root: /shared

# The image a job is built on, its extras what the platform itself asks for
python_version: PYTHON3_13
image_extras:
  - digitalhub>=0.15.8,<0.16
  - pandas

# Whether every stage queues on the shared pool rather than the reserved one,
# which marks each profile below with -shared.
shared: false

# What the platform gives each stage, which asks for what that stage is held up
# by. A profile settles the cores and the memory of the box: cpu exists on both
# pools. What is asked for here is what the job is scheduled on; the profile
# settles the limit it is killed at. The image build reads none of the stages,
# so it names a profile alone.
resources:
  image:
    profile: cpu
  pipeline:
    profile: cpu
    cpu: 8
    memory: 32Gi
    disk: 64Gi
  selection:
    profile: cpu
    cpu: 8
    memory: 32Gi
    disk: 64Gi
  # A build waits on the archives, not the cores, and its disk holds the whole dataset
  build:
    profile: cpu
    cpu: 8
    memory: 40Gi
    budget: 24Gi
    disk: 660Gi

# The function each run is registered as, the project scoping it so it needs no prefix
functions:
  pipeline: analysis-pipeline
  selection: select-features
  build: build-dataset

# What each stage publishes, which is what dh_download.sh brings back down.
publishes:
  coverage: coverage
  metadata: metadata
  selection: selection
  stats: stats
  summary: summary
  dataset: dataset
