# What a run submitted to DigitalHub is given, and what it publishes.

# The project every run and every published archive belongs to.
project: mars-multisensor-features

# The repository the platform clones, and where that clone lands on the job.
repository: https://github.com/andreablushi/mars-multisensor-features
source_root: /shared

# The image a job is built on. The extras are what the platform itself asks
# for: registering a table samples it with pandas, which the pipeline never needs.
python_version: PYTHON3_13
image_extras:
  - digitalhub>=0.15.6,<0.16
  - pandas

# What the platform gives each half, which asks for what that half is held up by.
resources:
  pipeline:
    cpu: 16
    memory: 32Gi
    disk: 64Gi
  stats:
    cpu: 16
    memory: 32Gi
    disk: 64Gi
  # A build waits on the archives and not on the cores: the last one held its
  # sixteen at eight busy through the CTX half and at none at all through the
  # SHARAD half, every thread being on the network. The downloads are a count of
  # their own, so fewer cores costs a build nothing. The disk holds the whole
  # dataset at once, which is no longer packed into an archive beside itself.
  build:
    cpu: 8
    memory: 32Gi
    disk: 250Gi

# The function each run is registered as: the whole pipeline, or the selection
# alone. The project scopes them already, so a name carries no prefix.
functions:
  pipeline: analysis-pipeline
  stats: select-features
  build: build-dataset

# What each half publishes, which is what dh_download.sh brings back down.
publishes:
  coverage: coverage
  catalog: catalog
  metadata: metadata
  selection: selection
  stats: stats
  summary: summary
  dataset: dataset
