# How the tiles the selection kept are labelled

# The share of a texture feature's box a tile has to lie in, about its centre,
# since ODE gives a box and not an outline, and its edges often hold other ground.
core: 0.5

# How many tiles are drawn of every class, or null for as many as the scarcest
# class holds
per_class: null

# The number the draw is made with, so the set is the same every run.
seed: 42

# Every class, by the IAU descriptor or the named features it is read from.
classes:
  crater: {descriptor: Crater, diameter_km: [8, 32]}
  chaos: {descriptor: Chaos}
  dune_field: {descriptor: Unda}
  fossae: {descriptor: Fossa}
  labyrinthus: {descriptor: Labyrinthus}
  polar_layered_deposits: {names: [Planum Boreum, Planum Australe]}
  shield_volcano:
    names: [Olympus Mons, Ascraeus Mons, Pavonis Mons, Arsia Mons, Alba Mons, Elysium Mons]
  ice_rich_plains: {names: [Arcadia Planitia, Utopia Planitia], latitudes: [38, 50]}
  ice_poor_plains: {names: [Amazonis Planitia, Elysium Planitia], latitudes: [-30, 30]}
