# A run downloads every set still missing and measures every set not yet measured.

# Jobs at once in each half: download threads, then coverage processes.
workers: 16

# The side every tile of the grid Mars is split into is sized to, in km.
tile_km: 32

# The side of the tile groups ODE is asked about at once, in degrees.
tile_group_deg: 10

# How many cells every 100 km of a tile is divided into. For computation purpose.
grid_cells: 32

# What a run downloads and measures, and what the notebook figures draw in turn.
# IHID/IID/PT, and a colon plus an ODE product id pattern to narrow the type.
instruments:
  - MRO/CTX/EDR
  - MRO/CRISM/TRDR:msp*if*trr3  # the multispectral survey, reflectance cubes only
  - MRO/SHARAD/USRDRV2

# Which products a box returns: b box overlap, f footprint overlap, o inside, i containing.
loc: f

# What a window has to hold before a tile earns a place in the dataset.
window:
  # The coverage each instrument is asked of a tile, in percent of its area.
  constraints:
    - {CTX: 0.90}
    - {CRISM: 0.70}
    - {SHARAD: 0.0}

  # The pixels an instrument has to land on a tile to count, powers of two preferred
  admits: {CTX: 65536, CRISM: 4096, SHARAD: 64}

  # How far Mars may turn inside a window, in degrees of Ls; 90 is one season
  span_ls: 90.0

  # What instruments are excluded from the window, and kept whenever they came
  timeless: [SHARAD]
