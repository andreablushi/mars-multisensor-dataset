# What a window has to hold before a feature earns a place in the dataset.

# The coverage each instrument is asked of a feature, in percent of its area.
constraints:
  - {CTX: 0.50}
  - {CRISM: 0.30}
  - {SHARAD: 0.0}

# The pixels an instrument has to land on a feature to count, powers of two preferred
admits: {CTX: 65536, CRISM: 4096, SHARAD: 64}

# How far Mars may turn inside a window, in degrees of Ls; 90 is one season
span_ls: 90.0

# What instruments are excluded from the window, and kept whenever they came
timeless: [SHARAD]
