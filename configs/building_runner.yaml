# What a build of the dataset holds, and how much of it to build.

# The directory it is written in and the name it is published under.
name: small

# What share of the features the selection kept to build, above zero and up to one.
share: 0.02

# The number every draw is made with, so a smaller build is a reproducible subset.
seed: 42

# The observations a feature may keep and still be built. A handful of polar
# landforms are seen thousands of times, and they carry half the dataset between
# them, so one over this is left out whole rather than built in part.
max_observations: 500
