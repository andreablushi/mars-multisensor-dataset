# What the training build holds, and how much of it to build.

# How every build runs, which this one is composed over.
defaults:
  - /common/building@_here_
  - _self_

# The directory it is written in and the name it is published under.
name: training

# What share of the tiles the selection kept to build, above zero and up to one.
share: 1.0

# The number every draw is made with, so a smaller build is a reproducible subset.
seed: 42
