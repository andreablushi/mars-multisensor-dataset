[project]
name = "mars-multisensor-features"
version = "0.1.0"
description = "A multi-sensor dataset of Mars geological features: co-temporal CTX, CRISM and SHARAD observations cropped to each feature."
readme = "README.md"
authors = [
    { name = "Andrea Blushi", email = "andreablushi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "rich>=14.0.0",
    "shapely>=2.1.2",
    "tifffile>=2026.8.23",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [
    "analysis",
    "building",
    "utils",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
notebook = [
    "ipywidgets>=8.1.5",
    "jupyterlab>=4.3.0",
    "matplotlib>=3.10.0",
    "pandas>=2.2",
    "xarray>=2026.7.0",
]
digitalhub = [
    "digitalhub>=0.15,<0.16",
    "digitalhub-runtime-python>=0.15,<0.16",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"
